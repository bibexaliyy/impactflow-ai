{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
    <h1 class="text-xl font-semibold mb-6">Create your organization workspace</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded">Sign up</button>
    </form>
    <p class="text-sm text-gray-500 mt-4">
        Already have an account? <a href="{% url 'accounts:login' %}" class="underline">Log in</a>
    </p>
</div>
{% endblock %}
