<div class="bg-white border border-gray-200 rounded-lg p-6 space-y-5">
    <div class="flex justify-between items-center border-b pb-3">
        <span class="text-sm text-gray-500">
            Generated in {{ report.generation_seconds }}s
        </span>
        <div class="flex gap-2">
            <a href="{% url 'reports:download_docx' report.pk %}"
               class="text-sm border border-gray-300 rounded px-3 py-1.5 hover:bg-gray-50">
                Download Word
            </a>
            <a href="{% url 'reports:download_pdf' report.pk %}"
               class="text-sm border border-gray-300 rounded px-3 py-1.5 hover:bg-gray-50">
                Download PDF
            </a>
        </div>
    </div>

    {% for label, content in report.sections %}
        <div>
            <h2 class="font-semibold text-sm uppercase tracking-wide text-gray-500 mb-1">{{ label }}</h2>
            <p class="text-sm leading-relaxed whitespace-pre-line">{{ content }}</p>
        </div>
    {% endfor %}
</div>
