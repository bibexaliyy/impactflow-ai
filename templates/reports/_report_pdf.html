<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Helvetica, Arial, sans-serif; color: #1a1a1a; font-size: 11pt; line-height: 1.5; }
        h1 { font-size: 18pt; margin-bottom: 4px; }
        .subtitle { color: #666; font-size: 10pt; margin-bottom: 24px; }
        h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: 0.5px; color: #555; margin-top: 20px; margin-bottom: 4px; }
        p { margin: 0 0 8px 0; white-space: pre-line; }
    </style>
</head>
<body>
    <h1>{{ report.project.project_title }}</h1>
    <div class="subtitle">{{ report.get_report_type_display }} &middot; {{ report.project.location }}</div>

    {% for label, content in report.sections %}
        <h2>{{ label }}</h2>
        <p>{{ content }}</p>
    {% endfor %}
</body>
</html>
